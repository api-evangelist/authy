aid: authy
name: Authy
description: >-
  Authy is a two-factor authentication (2FA) product originally built by Authy
  Inc. and acquired by Twilio in 2015. It provided a consumer authenticator app
  (TOTP soft tokens, encrypted cloud backup, and multi-device sync) alongside a
  developer-facing Authy API for one-time passwords over SMS and voice, soft
  tokens, and push authentication. Twilio has since folded the Authy developer
  API into the Twilio Verify API, deprecated and archived the first-party Authy
  client SDKs, and discontinued the Authy desktop applications in 2024. The
  consumer Authy mobile app remains available. New integrations are directed to
  Twilio Verify. This profile was surfaced as a portfolio-company lead and is
  enriched here from Authy's remaining public surface (marketing site, archived
  GitHub organization, and deprecated SDK registries).
